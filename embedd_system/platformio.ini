[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_port = COM7
monitor_speed = 9600
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp8266_exception_decoder, default
upload_resetmethod = nodemcu
lib_ignore = LCD, KEYBAD
lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.3
    bblanchon/ArduinoJson @ ^6.21.3

[env:ATmega32]
platform = atmelavr
board = ATmega32
framework = arduino
upload_protocol = usbasp
upload_flags =
    -e
    -B 32
; ✅ 8MHz Internal RC Oscillator (بدل 16MHz)
board_build.f_cpu = 8000000L
lib_ignore = NFC
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
build_flags =
    -I${PROJECT_DIR}/include
    -DF_CPU=8000000UL